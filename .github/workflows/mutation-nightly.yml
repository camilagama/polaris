name: Mutation nightly

# Stryker on packages/domain (money, sales, inventory, economics), outside the pull request.
# Incremental by folder: only the mutants of the files changed since the last run are tested again.
# Report only; there is no score threshold (Stryker's break is off).
on:
  schedule:
    - cron: "0 8 * * *" # 05:00 in Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  # A complete run leaves a cache entry named after the commit it tested; the next night
  # skips when main is still that commit. A run cut by the deadline leaves no entry,
  # so the next night continues from the incremental files it saved.
  changed:
    name: Main changed since the last complete run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || steps.last.outputs.cache-hit != 'true' }}
    steps:
      - id: last
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .stryker-complete
          key: stryker-complete-${{ github.sha }}
          lookup-only: true

  mutation:
    name: Stryker, packages/domain
    needs: changed
    if: github.ref == 'refs/heads/main' && needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # One file per folder. A cache entry never changes, so each run saves under its own key
      # and the next one restores the most recent entry by the prefix.
      - name: Restore the incremental files
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: packages/domain/reports/stryker-incremental-*.json
          key: stryker-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-
      # The script runs one folder at a time, stops at the deadline (Stryker saves what it
      # tested), and writes the score per folder and the survivors by file and line to
      # GITHUB_STEP_SUMMARY.
      - name: Mutation testing
        env:
          MUTATION_DEADLINE_MINUTES: "13"
        run: bun run --filter @polaris/domain test:mutation
      - name: Save the incremental files
        if: ${{ !cancelled() && hashFiles('packages/domain/reports/stryker-incremental-*.json') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: packages/domain/reports/stryker-incremental-*.json
          key: stryker-incremental-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report
          path: packages/domain/reports/mutation/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      # reports/complete (it holds the word "complete") exists only when the four folders finished in this run.
      - name: Mark this commit as tested
        if: hashFiles('packages/domain/reports/complete') != ''
        run: echo "$GITHUB_SHA" > .stryker-complete
      - name: Save the mark
        if: hashFiles('packages/domain/reports/complete') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .stryker-complete
          key: stryker-complete-${{ github.sha }}
