name: CI

run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0} PR #{1} {2}', inputs.full && 'CI completo' || 'CI', inputs.pr || '?', github.sha) || github.event.pull_request.title || github.event.head_commit.message || 'CI' }}"

on:
  pull_request:
  push:
    branches:
      - main
  # A full run on demand: every job runs, whatever the change touched. `pr` only names the run.
  workflow_dispatch:
    inputs:
      full:
        description: Run every job (browser gate, Lighthouse, catalog CSP, e2e, audit), ignoring the changed areas
        type: boolean
        default: true
      pr:
        description: Pull request number (only for the name of the run)
        type: string
        required: false

permissions:
  contents: read

# "true" in a manual run with `full` and in a pull request with the `suite-completa` label: the aggregate gate below
# then accepts nothing but success. scripts/ci-changed.mjs reports every area as changed in any manual run and
# whenever CI_FULL is "true".
env:
  CI_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.pull_request.labels.*.name, 'suite-completa') }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minutes matter (private repository): GitHub bills every job rounded up to the
# whole minute, so the cheap checks share one job and one install, the browser
# gate and the audit run only when a change can affect them, and the browser
# gate does not repeat on main what the pull request already proved. Nothing is
# relaxed: every check that ran before still runs on every pull request that
# can change its result.
jobs:
  # Decides, in about a minute, which of the expensive jobs below are needed.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.changed.outputs.browser }}
      dependencies: ${{ steps.changed.outputs.dependencies }}
      e2e: ${{ steps.changed.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent (the base of a pull request merge): `git diff --name-only`
          # reads trees, not file contents, and the job only runs scripts/ci-changed.mjs, so no blob outside
          # scripts/ is downloaded.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: scripts
          persist-credentials: false
      - id: changed
        run: node scripts/ci-changed.mjs

  checks:
    name: Checks (lint, types, knip, build, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - id: install
        env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      # Every check runs even when an earlier one failed, so one run shows all
      # the problems; the job still fails if any of them failed.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check
      - name: Import boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run boundaries
      # Schema drift: regenerating migrations from the Drizzle schema must change nothing.
      - name: Schema drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @polaris/db db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --porcelain -- packages/db/drizzle
            echo "::error::drizzle-kit generate produced changes; commit the generated migration.";
            exit 1
          fi
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      # The offline labs and the UI gallery are for the browser checks; this reads the files of the build just made
      # (apps/web/dist, client and Worker) and fails if any chunk, route or source map carries one of them.
      - name: No offline lab in the production build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run verify:no-lab-in-build
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

  database:
    name: PostgreSQL 18 gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A red job here is a red pull request: it has been green on every pull
    # request since the billing chain began and every failure it showed was a
    # real defect (ADR 0025, amended). The same gates also run on a disposable
    # Neon branch before a release.
    # The gate owner is NOT a superuser, as neondb_owner on Neon (ADR 0025,
    # amended): the container's superuser is postgres, handed only to the
    # gates that need one through POLARIS_GATE_SUPERUSER_URL.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: polaris-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_BRANCH: pr0-ci-gate
      POLARIS_GATE_DATABASE: polaris_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - name: Create the gate owner and its database, as on Neon (not a superuser)
        run: |
          psql "postgresql://postgres:polaris-ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE neondb_owner LOGIN NOSUPERUSER CREATEDB CREATEROLE BYPASSRLS REPLICATION PASSWORD 'polaris-ci'" \
            -c "GRANT pg_monitor, pg_signal_backend TO neondb_owner"
          psql "postgresql://neondb_owner:polaris-ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE polaris_gate"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user" | grep -qx f
      - name: Create the runtime role that lives outside the migrations
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE polaris_pr11_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS"
      - name: Replay every migration from scratch
        run: bun run --filter @polaris/db db:migrate
      - name: Run the sales and hardening gates in sequence
        # The superuser URL lives only in this step: install and setup steps
        # never see it, and the gate executor strips it from the gates that
        # do not need one.
        env:
          POLARIS_GATE_SUPERUSER_URL: postgresql://postgres:polaris-ci@localhost:5432/polaris_gate
        run: bun run --filter @polaris/db gates:ci

  # Only when a dependency can have changed; a new advisory should be visible,
  # not block unrelated PRs.
  audit:
    name: Dependency audit
    needs: changes
    # a failed detection runs it anyway: never skipped by accident
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - run: bun audit --audit-level=high

  # Page speed on a simulated phone (Lighthouse CI, apps/web/lighthouserc.json): LCP, TBT, CLS and the JS bytes of the
  # sign-in page, the public catalog and the Início, the median of three rounds each, over the production client and
  # fixture servers (no Worker, no database). Assertions are warnings, so the job reports and never fails the pull
  # request on a number: it is outside the `needs` of "Offline persistence browser gate" and continues on error until
  # the assertions turn to errors. Nothing is uploaded: the reports are an artifact of the run.
  lighthouse:
    name: Lighthouse (mobile, simulated)
    needs: changes
    # the same condition as the browser gate, so a failed detection runs it anyway
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      # the Chromium of the Playwright in bun.lock, the same build as the one in the image of the visual checks
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run --filter @polaris/web build
      - run: bun run --filter @polaris/web test:lighthouse
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/
          # the folder is hidden: without this the artifact would be empty
          include-hidden-files: true
          retention-days: 14

  # The split by time is scripts/ci-shard-plan.mjs; its guard is shard-coverage below.
  # A pull request plans only the specs its diff reaches (scripts/ci-select-specs.mjs, from e2e/coverage-map.mjs): the
  # whole suite runs on a manual dispatch, with the `suite-completa` label, on a change that touches shared code or a
  # path the map does not name, and whenever the selection fails. Nothing in this workflow starts the full suite before
  # the merge: the automerge script dispatches it on the updated head (its switch lives outside the repository).
  shard-plan:
    name: Offline browser gate (plan)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      selected: ${{ steps.plan.outputs.selected }}
    env:
      SHARDS: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent (the base of a pull request merge), for the diff of the selection.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      # --list loads the configs and the spec files but starts no browser and no web server.
      # The projects must be those of the shard steps; config.workers, read by the plan,
      # follows CI and the cores, the same here as in the shards.
      - name: List the tests of each config
        working-directory: apps/web
        run: |
          mkdir -p shard-plan
          PLAYWRIGHT_JSON_OUTPUT_FILE=shard-plan/list-offline-poc.json bunx playwright test --config playwright.offline-poc.config.ts --project=chromium-desktop --project=chromium-mobile-emulated --list --reporter=json > /dev/null
          PLAYWRIGHT_JSON_OUTPUT_FILE=shard-plan/list-pwa.json bunx playwright test --config playwright.pwa.config.ts --list --reporter=json > /dev/null
      # Never fails the job: a git or selector error leaves no selection file, and the plan then takes every file.
      - name: Select the specs of the change
        run: node scripts/ci-select-specs.mjs --diff HEAD^1 HEAD --out apps/web/shard-plan/selection.json || echo "the selection failed, the whole suite runs"
      - id: plan
        run: |
          node scripts/ci-shard-plan.mjs --shards "$SHARDS" --list offline-poc=apps/web/shard-plan/list-offline-poc.json --list pwa=apps/web/shard-plan/list-pwa.json --selection apps/web/shard-plan/selection.json --out apps/web/shard-plan/plan.json
          {
            echo "plan=$(jq -c . apps/web/shard-plan/plan.json)"
            echo "shards=$(jq -c '[.shards[].shard]' apps/web/shard-plan/plan.json)"
            echo "count=$(jq '.shards | length' apps/web/shard-plan/plan.json)"
            echo "selected=$(jq '[.shards[].files[] | length] | add // 0' apps/web/shard-plan/plan.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-plan
          path: apps/web/shard-plan/
          retention-days: 7
          if-no-files-found: error

  # The most expensive gate (about 25 minutes when it ran as one job). It runs on pull
  # requests that change something it exercises (not on prose or database-only changes)
  # and on demand; it does not repeat on main what the pull request already proved.
  # The same suites and projects as one job would run, split into SHARDS shards (set in shard-plan)
  # that run in parallel (each shard runs its files of test:offline-poc and test:pwa, every project of
  # each file). Splitting by browser project left 21 min on desktop and 6 on mobile (run
  # 40078910891), so shards it is. The catalog CSP test runs in its own job
  # (offline-catalog-csp-browser) so it no longer adds to the longest shard.
  # The job named "Offline persistence browser gate" stays as the single result that
  # branch rules, the automerge and the bots read.
  offline-poc-browser-part:
    name: Offline browser gate (shard ${{ matrix.shard }}/${{ needs.shard-plan.outputs.count }})
    needs: [changes, shard-plan]
    # a failed detection runs it anyway: never skipped by accident. A plan with no selected file skips it on purpose
    # (a pull request whose diff reaches no spec of the gate); the aggregate below accepts that only in a pull request.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.shard-plan.result == 'success' && needs.shard-plan.outputs.selected != '0' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # the default only keeps the expression valid when shard-plan was skipped and so is this job
        shard: ${{ fromJSON(needs.shard-plan.outputs.shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      # A suite with no file in this shard does not run here: Playwright fails a run with no
      # test, and shard-coverage checks that every listed test ran in some shard.
      - name: Files of the shard
        env:
          PLAN: ${{ needs.shard-plan.outputs.plan }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard"
          printf '%s' "$PLAN" > "$RUNNER_TEMP/shard/plan.json"
          for suite in offline-poc pwa; do
            node scripts/ci-shard-plan.mjs --filters "$RUNNER_TEMP/shard/plan.json" --shard "$SHARD" --suite "$suite" > "$RUNNER_TEMP/shard/$suite.txt"
            echo "$suite: $(wc -l < "$RUNNER_TEMP/shard/$suite.txt") files"
          done
      - working-directory: apps/web
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard/offline-poc.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no offline-poc file in this shard"
            exit 0
          fi
          bun run test:offline-poc --project=chromium-desktop --project=chromium-mobile-emulated "${files[@]}"
      - working-directory: apps/web
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard/pwa.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no pwa file in this shard"
            exit 0
          fi
          bun run test:pwa "${files[@]}"
      # The time per test file (timings-<name>.json of the two Playwright configs), read by
      # scripts/ci-timing.mjs --durations. Uploaded even when a test failed.
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-timings-shard-${{ matrix.shard }}
          path: apps/web/test-timings/
          retention-days: 3
          if-no-files-found: ignore
          # a rerun of the job uploads the same name; shard-coverage must read the last attempt
          overwrite: true
      # The whole trace of the tab (rastro-*.txt of e2e-pwa/network-trace.ts) and the Playwright traces of the
      # failed tests: without this the files go away with the runner. Skipped when the shard is green.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-browser-trace-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The public catalog under its production CSP (ADR 0090): nonce on every inline
  # script, no inline style, hydration without violations, catalog_nonce_missing.
  # Same conditions as the shards; the aggregate below reads its result too.
  offline-catalog-csp-browser:
    name: Catalog CSP browser test
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/catalog
      - run: bun run --filter @polaris/catalog test:e2e
        env:
          POLARIS_CATALOG_E2E: "1"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-catalog-csp-trace
          path: apps/catalog/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Runs after failed shards too: their reports still say what did not run.
  shard-coverage:
    name: Offline browser gate (shard coverage)
    needs: [changes, shard-plan, offline-poc-browser-part]
    if: ${{ !cancelled() && github.event_name != 'push' && needs.shard-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shard-plan
          path: shard-plan
      - if: ${{ needs.shard-plan.outputs.selected != '0' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-timings-shard-*
          path: shard-reports
      - run: node scripts/ci-shard-coverage.mjs --plan shard-plan/plan.json --list offline-poc=shard-plan/list-offline-poc.json --list pwa=shard-plan/list-pwa.json --reports shard-reports

  offline-poc-browser:
    name: Offline persistence browser gate
    needs: [changes, shard-plan, offline-poc-browser-part, shard-coverage, offline-catalog-csp-browser]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # green when the plan, every shard, the shard coverage and the catalog CSP test passed,
      # or when the change detection skipped them on purpose (browser explicitly false), or
      # when the plan of a pull request selected no spec (shards skipped, plan, coverage and
      # catalog green); red on any failure, cancellation or any other skip. A full run
      # (CI_FULL) has no skipping on purpose: only success counts.
      - env:
          PLAN: ${{ needs.shard-plan.result }}
          PARTS: ${{ needs.offline-poc-browser-part.result }}
          COVERAGE: ${{ needs.shard-coverage.result }}
          CATALOG: ${{ needs.offline-catalog-csp-browser.result }}
          CHANGES: ${{ needs.changes.result }}
          BROWSER: ${{ needs.changes.outputs.browser }}
          SELECTED: ${{ needs.shard-plan.outputs.selected }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "plan=$PLAN parts=$PARTS coverage=$COVERAGE catalog=$CATALOG changes=$CHANGES browser=$BROWSER selected=$SELECTED event=$EVENT full=$CI_FULL"
          if [ "$PLAN" = success ] && [ "$PARTS" = success ] && [ "$COVERAGE" = success ] && [ "$CATALOG" = success ]; then exit 0; fi
          if [ "$CI_FULL" = true ]; then exit 1; fi
          if [ "$EVENT" = pull_request ] && [ "$SELECTED" = 0 ] && [ "$PLAN" = success ] && [ "$PARTS" = skipped ] && [ "$COVERAGE" = success ] && [ "$CATALOG" = success ]; then exit 0; fi
          if [ "$PLAN" = skipped ] && [ "$PARTS" = skipped ] && [ "$COVERAGE" = skipped ] && [ "$CATALOG" = skipped ] && [ "$CHANGES" = success ] && [ "$BROWSER" = false ]; then exit 0; fi
          exit 1

  e2e-real:
    name: e2e journeys on the real local stack
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: polaris-ci
          POSTGRES_DB: polaris_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neondb_owner -d polaris_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      POLARIS_E2E_DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: node-modules
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - env:
          NODE_MODULES_HIT: ${{ steps.node-modules.outputs.cache-hit }}
        run: |
          if [ "$NODE_MODULES_HIT" != "true" ]; then
            bun install --frozen-lockfile
          fi
      - if: ${{ steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: e2e journeys (two production builds, a database per run)
        working-directory: apps/web
        run: npx playwright test --config playwright.e2e-real.config.ts
      - name: Flaky report (fails on 2+ flaky tests or any flaky money journey)
        if: ${{ !cancelled() }}
        run: node scripts/e2e-flaky-report.mjs apps/web/test-results/e2e-real-report.json
      - name: Confinement against the e2e bundles
        if: ${{ !cancelled() }}
        env:
          E2E_REQUIRE_BUNDLES: "1"
        run: bunx vitest run --project node apps/web/e2e-real/confinement.test.ts
