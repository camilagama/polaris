name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # A full run on demand, browser gate and dependency audit included.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minutes matter (private repository): GitHub bills every job rounded up to the
# whole minute, so the cheap checks share one job and one install, the browser
# gate and the audit run only when a change can affect them, and the browser
# gate does not repeat on main what the pull request already proved. Nothing is
# relaxed: every check that ran before still runs on every pull request that
# can change its result.
jobs:
  # Decides, in about a minute, which of the expensive jobs below are needed.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.changed.outputs.browser }}
      dependencies: ${{ steps.changed.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit under test and its first parent (the base of a pull request merge).
          fetch-depth: 2
          persist-credentials: false
      - id: changed
        run: node scripts/ci-changed.mjs

  checks:
    name: Checks (lint, types, knip, build, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - id: install
        run: bun install --frozen-lockfile
      # Every check runs even when an earlier one failed, so one run shows all
      # the problems; the job still fails if any of them failed.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check
      - name: Import boundaries
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run boundaries
      # Schema drift: regenerating migrations from the Drizzle schema must change nothing.
      - name: Schema drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          bun run --filter @polaris/db db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            git status --porcelain -- packages/db/drizzle
            echo "::error::drizzle-kit generate produced changes; commit the generated migration.";
            exit 1
          fi
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

  database:
    name: PostgreSQL 18 gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A red job here is a red pull request: it has been green on every pull
    # request since the billing chain began and every failure it showed was a
    # real defect (ADR 0025, amended). The same gates also run on a disposable
    # Neon branch before a release.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: neondb_owner
          POSTGRES_PASSWORD: polaris-ci
          POSTGRES_DB: polaris_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neondb_owner -d polaris_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_BRANCH: pr0-ci-gate
      POLARIS_GATE_DATABASE: polaris_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Create the runtime role that lives outside the migrations
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE polaris_pr11_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS"
      - name: Replay every migration from scratch
        run: bun run --filter @polaris/db db:migrate
      - name: Run the sales and hardening gates in sequence
        run: bun run --filter @polaris/db gates:ci

  # Only when a dependency can have changed; a new advisory should be visible,
  # not block unrelated PRs.
  audit:
    name: Dependency audit
    needs: changes
    # a failed detection runs it anyway: never skipped by accident
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dependencies == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # braces has no fixed release; exception in docs/runbooks/dependency-audit.md, review on 2026-11-18
      - run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

  # The most expensive job (about nine minutes). It runs on pull requests that
  # change something it exercises (not on prose or database-only changes) and on
  # demand; it does not repeat on main what the pull request already proved.
  offline-poc-browser:
    name: Offline persistence browser gate
    needs: changes
    # a failed detection runs it anyway: never skipped by accident
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run test:offline-poc --project=chromium-desktop --project=chromium-mobile-emulated
        working-directory: apps/web
      - run: bun run test:pwa
        working-directory: apps/web
