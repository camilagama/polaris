name: Concurrency nightly

# The CI runs each race once (gates:ci). An intermittent race is what one round
# misses, so the concurrency suite runs every night on main with 3 rounds
# (gates:concurrency), outside the pull request: it does not slow any PR.
# Approved by the user on 2026-10-28 (menor do PR 191).
on:
  schedule:
    - cron: "30 7 * * *" # 04:30 in Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concurrency-nightly
  cancel-in-progress: false

jobs:
  concurrency:
    name: Concurrency suite, 3 rounds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The gate owner is NOT a superuser, as neondb_owner on Neon and as in the
    # "PostgreSQL 18 gates" job of ci.yml (ADR 0025, amended).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: polaris-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_DATABASE_URL: postgresql://neondb_owner:polaris-ci@localhost:5432/polaris_gate
      POLARIS_GATE_BRANCH: pr0-ci-gate
      POLARIS_GATE_DATABASE: polaris_gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Create the gate owner and its database, as on Neon (not a superuser)
        run: |
          psql "postgresql://postgres:polaris-ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE neondb_owner LOGIN NOSUPERUSER CREATEDB CREATEROLE BYPASSRLS REPLICATION PASSWORD 'polaris-ci'" \
            -c "GRANT pg_monitor, pg_signal_backend TO neondb_owner"
          psql "postgresql://neondb_owner:polaris-ci@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE polaris_gate"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user" | grep -qx f
      - name: Create the runtime role that lives outside the migrations
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE polaris_pr11_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS"
      - name: Replay every migration from scratch
        run: bun run --filter @polaris/db db:migrate
      - name: Run the concurrency suite, 3 rounds per race
        # Only this step sees the superuser URL. With it set, the executor
        # refuses a superuser owner, so the guard holds here too.
        env:
          POLARIS_GATE_SUPERUSER_URL: postgresql://postgres:polaris-ci@localhost:5432/polaris_gate
        run: bun run --filter @polaris/db gates:concurrency

