<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="light dark" name="color-scheme">
    <!-- the --background of each theme (DESIGN.md); a theme chosen in the app moves the media (src/lib/theme.ts) -->
    <meta
      content="oklch(0.985 0.004 85)"
      data-tema="claro"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="oklch(0.2 0.0035 85)"
      data-tema="escuro"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >
    <!-- the theme before the first paint (ADR 0103); external, the CSP runs no inline script -->
    <!-- biome-ignore lint/performance/noSyncScripts: it must run before the first paint, or the page blinks -->
    <script src="/theme-init.js"></script>
    <!-- the text font fetched with the page instead of after the CSS, so the swap comes before the first paint
         (the same file as the @font-face of src/styles/index.css: Vite gives both the one hashed asset) -->
    <link
      as="font"
      crossorigin
      href="./node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      rel="preload"
      type="font/woff2"
    >
    <!-- before the entry module: a page whose entry never ran reloads itself once (public/boot-retry.js) -->
    <script defer src="/boot-retry.js"></script>
    <link href="/manifest.webmanifest" rel="manifest">
    <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon">
    <meta content="yes" name="mobile-web-app-capable">
    <meta content="Polaris" name="apple-mobile-web-app-title">
    <title>Polaris</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
